    <script>
      (function() {
        try {
          var k = '__storage_guard__';
          window.localStorage.setItem(k, k);
          window.localStorage.removeItem(k);
        } catch (e) {
          console.warn('localStorage is restricted or unavailable. Initializing memory fallback store.');
          var store = {};
          var fallback = {
            getItem: function(key) { return Object.prototype.hasOwnProperty.call(store, key) ? store[key] : null; },
            setItem: function(key, val) { store[key] = String(val); },
            removeItem: function(key) { delete store[key]; },
            clear: function() { store = {}; },
            key: function(i) { return Object.keys(store)[i] || null; },
            get length() { return Object.keys(store).length; }
          };
          try {
            Object.defineProperty(window, 'localStorage', { value: fallback, configurable: true, writable: true });
          } catch (_) {}
        }
      })();
    </script>
